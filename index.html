  <style>
    :root {
      color-scheme: dark;
      background: #1b120a;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(180deg, #2a1a0b 0, #17100a 34rem, #17100a 100%);
    }

    main {
      width: min(100%, 760px);
      margin-inline: auto;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .campaign-pages {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vw, 12px);
      padding-block: clamp(0px, 1.2vw, 16px);
    }

    .campaign-page {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin: 0;
      background: #f3bb43;
      box-shadow: 0 16px 40px rgb(0 0 0 / 28%);
    }

    .campaign-page img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1767 / 2500;
    }

    /* Área clicável alinhada ao botão e ao endereço impresso na última página. */
    .cta-link {
      position: absolute;
      z-index: 1;
      top: 61.8%;
      left: 18%;
      width: 64%;
      height: 10.2%;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
      box-shadow: 0 0 0 8px rgb(76 39 4 / 72%);
    }

    @media (hover: hover) {
      .cta-link:hover {
        background: rgb(255 255 255 / 5%);
      }
    }

    @media (max-width: 600px) {
      body {
        background: #17100a;
      }

      .campaign-pages {
        gap: 4px;
      }

      .campaign-page {
        box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
